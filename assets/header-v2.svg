<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Arda Çiftçi — AI, data and systems</title>
  <desc id="desc">A black and red motorsport-inspired technical banner</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090d"/>
      <stop offset="0.56" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#21070a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.12" cy="0.5" r="0.48">
      <stop offset="0" stop-color="#ff2038" stop-opacity="0.68"/>
      <stop offset="0.36" stop-color="#9b111e" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="speed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff304f"/>
      <stop offset="0.65" stop-color="#a31223"/>
      <stop offset="1" stop-color="#a31223" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8b949e" stroke-opacity="0.055"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>

  <g opacity="0.72">
    <path d="M0 268H86L148 206H552" fill="none" stroke="url(#speed)" stroke-width="2"/>
    <path d="M0 281H52L120 213" fill="none" stroke="#ef233c" stroke-opacity="0.22"/>
    <path d="M0 84H88M0 101H54M0 118H116" stroke="#ef233c" stroke-opacity="0.38" stroke-width="2"/>
    <path d="M812 68H1200M873 81H1200M946 94H1200" stroke="url(#speed)"/>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <text x="150" y="105" fill="#8b949e" font-size="15" font-weight="650" letter-spacing="4">AI R&amp;D // ENGINEERING</text>
    <text x="150" y="168" fill="#f0f3f6" font-size="58" font-weight="760" letter-spacing="1">ARDA ÇİFTÇİ</text>
    <rect x="150" y="190" width="610" height="3" rx="2" fill="url(#speed)"/>
    <text x="150" y="230" fill="#c9d1d9" font-size="20">Machine Learning · Deep Learning · Software Engineering</text>
    <text x="150" y="264" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" letter-spacing="1">DATA → MODELS → MEASURABLE SYSTEMS</text>
  </g>

  <circle cx="1117" cy="50" r="4" fill="#ff304f" filter="url(#soft)"/>
  <path d="M1022 50h76M1136 50h30" stroke="#ef233c" stroke-opacity="0.30"/>
  <text x="1091" y="282" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">OXY // 01</text>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#30363d"/>
</svg>
